# ---------------------------------------------------------------------------
# Fuentes del panel. Edita este archivo para agregar, quitar o mover medios.
#
# Cada fuente acepta:
#   nombre     : cómo se muestra en el panel
#   url        : la dirección del feed RSS/Atom
#   seccion    : nacional | ia | colombia | argentina | espana | espectaculos
#   subseccion : solo para "nacional" -> politica | seguridad | economia |
#                cdmx | opinion | tecnologia.  Si la omites, el titular se clasifica solo por
#                palabras clave (ver scripts/clasificar.py).
#   grupo      : solo para "ia" -> nyt | otros
#
# Nota sobre "vía Google Noticias": varios medios mexicanos y latinoamericanos
# ya no publican RSS propio (Milenio, Excélsior, Infobae por país, El Destape,
# El Espectador y más devolvían 404 o 403). Para esos se usa un feed de
# búsqueda de Google Noticias limitado a su dominio y al último día. Funciona,
# pero la liga pasa por news.google.com antes de llegar al medio.
# ---------------------------------------------------------------------------

ajustes:
  # Cuántos titulares se guardan por grupo
  max_por_grupo: 25
  # Máximo de titulares que un mismo medio puede ocupar al principio de un
  # grupo. Lo que rebasa no se borra: baja al final marcado como desplazado.
  # Evita que un feed de alto volumen (Milenio vía Google) acapare la sección.
  # Ponlo en 0 para desactivar el tope.
  tope_por_fuente: 8
  # Antigüedad máxima de un titular, en horas
  horas_maximas: 48
  # El panel arranca vacío cada medianoche (hora CDMX): solo entran titulares
  # publicados a partir de las 00:00 de hoy. Ponlo en false si prefieres que
  # arrastre lo de ayer.
  reinicio_diario: true
  # Segundos de espera por feed antes de rendirse
  timeout: 20
  # Descargas en paralelo
  hilos: 8

  # --- Curaduría con la API de Claude ---------------------------------------
  # Solo se activa si el repositorio tiene el secreto ANTHROPIC_API_KEY.
  # Sin llave, el panel funciona igual con la clasificación por palabras clave.
  # El modelo lee criterios.md y decide sección, prioridad y resúmenes.
  # Modelos disponibles, de menor a mayor capacidad y costo:
  #   claude-haiku-4-5  ($1 / $5 por millón de tokens)  <- el más barato
  #   claude-sonnet-5   ($2 / $10, sube a $3/$15 el 1 de septiembre)
  #   claude-opus-5     ($5 / $25)
  # Haiku alcanza de sobra para clasificar y escribir resúmenes cortos.
  modelo_ia: claude-haiku-4-5
  # Cuántas notas por llamada. Más grande = menos llamadas pero cada una tarda
  # más y hay más riesgo de que la respuesta se corte a la mitad.
  lote_ia: 30
  # Llamadas simultáneas al modelo. En fila se pasaba del límite de tiempo del
  # workflow; en paralelo la curaduría completa baja a poco más de un minuto.
  hilos_ia: 5
  # Segundos de espera por llamada
  timeout_ia: 120

secciones:
  nacional:
    titulo: Nacional
    codigo: MX
    grupos:
      politica: Política
      seguridad: Seguridad
      economia: Economía
      cdmx: CDMX
      opinion: Opinión
      tecnologia: Tecnología
  ia:
    titulo: Inteligencia artificial
    codigo: IA
    grupos:
      nyt: The New York Times
      otros: Otros medios
  colombia:
    titulo: Colombia
    codigo: CO
    grupos:
      dia: Lo más importante del día
  argentina:
