    codigo: AR
    grupos:
      dia: Lo más importante del día
  espana:
    titulo: España
    codigo: ES
    grupos:
      dia: Lo más importante del día
  internacional:
    titulo: Internacional
    codigo: MUNDO
    grupos:
      ultima_hora: Última hora
      miradas: Miradas del mundo
  espectaculos:
    titulo: Espectáculos
    codigo: SHOW
    grupos:
      dia: Chismes y farándula

