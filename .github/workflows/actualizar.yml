name: Actualizar panel

on:
  schedule:
    # Horarios de la Ciudad de México, escritos en UTC (CDMX + 6 horas).
    - cron: "0 6 * * *"        # 00:00 — reinicio: el panel amanece vacío
    - cron: "30 12 * * *"      # 06:30
    - cron: "0 14,16,21 * * *" # 08:00, 10:00 y 15:00
    - cron: "0 2 * * *"        # 20:00 (en UTC ya es el día siguiente)
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths:
      - "fuentes.yaml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: panel
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer titulares
        env:
          # Si el secreto no existe, la variable llega vacía y el script
          # simplemente se salta la curaduría. No falla la corrida.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/recolectar.py

      - name: Publicar cambios
        run: |
          git config user.name "panel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # docs/datos son archivos generados: no tiene sentido fusionarlos con
          # los de otra corrida, siempre manda el recién generado. Por eso, si
          # alguien publicó mientras corríamos, se rehace el commit encima de lo
          # último en vez de intentar un rebase que acaba en conflicto.
          publicar() {
            git add docs/datos
            git diff --staged --quiet && return 1
            git commit -q -m "Titulares $(TZ=America/Mexico_City date '+%d/%m %H:%M')"
            return 0
          }

          if ! publicar; then
            echo "Sin titulares nuevos."
            exit 0
          fi

          for intento in 1 2 3; do
            if git push; then
              echo "Publicado en el intento $intento."
              exit 0
            fi
            echo "Otra corrida publicó primero; rehago el commit encima."
            git fetch origin main
            git reset --soft origin/main
            publicar || { echo "Nada que publicar tras la actualización."; exit 0; }
          done

          echo "No se pudo publicar tras tres intentos."
          exit 1
